name: Security Scan (self)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  security-scan:
    name: Scan own repo for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan repository for leaked secrets
        # eat-your-own-dog-food：用自带的扫描器扫自身。
        # 退出码非 0（发现泄露）会让该步骤失败，从而阻断 job。
        run: python scripts/security-scan.py --all
