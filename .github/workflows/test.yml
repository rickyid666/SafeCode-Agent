name: Tests

# 第二道防线：本地 hook 可以被删除、可以用 --no-verify 绕过，CI 不能。
# checkout 用 fetch-depth: 0，避免 shallow 仓库（SafeCode 对 shallow 是 Fail-Closed）。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run SafeCode test suite
        run: python -m pytest tests/ -v
